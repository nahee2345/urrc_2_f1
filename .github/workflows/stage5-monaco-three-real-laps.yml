name: "Monaco 0~5단계 실제 RGB 자율주행 3랩 합격 검증"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage5-monaco-three-real-laps.yml'
      - 'scripts/stage5_full_lap_audit.py'
      - 'scripts/stage5_start.py'
      - 'scripts/stage5_race.py'
      - 'stage5/**'
      - 'stage4/**'
      - 'vehicle_generator/sensors.py'
      - 'tests/test_stage5_*.py'

permissions:
  contents: read

concurrency:
  group: monaco-real-three-laps
  cancel-in-progress: true

jobs:
  audit_0_to_5:
    name: "0~5단계 Monaco 원본/센서/안전/랩 정적 감사"
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "실제 Monaco 공식 원본 GitHub 핀 검증"
        run: python3 scripts/check_upstream.py
      - name: "0~5단계 모든 Python 회귀시험"
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q vehicle_generator stage3 stage4 stage5 scripts tests
      - name: "원본 Monaco SDF 및 AI-01 물리 차량 생성"
        run: |
          python3 scripts/stage5_prepare_monaco.py --ai AI-01
          python3 scripts/stage5_bridge.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=Path("generated/stage5/AI-01")
          s=json.loads((a/"terrain_fidelity.json").read_text())
          assert s["status"]=="PASS_MONACO_SOURCE_FIDELITY"
          assert s["elevation_reference_m"]>8
          assert s["signal_lenses"]==5
          assert s["source_files_modified"] is False
          print("원본 Monaco 3D 도로/5등 무결성 PASS — 실제 3랩과 별개")
          PY

  real_3_laps:
    name: "원본 Monaco RGB 카메라+신호등+물리 3바퀴 무충돌 실제 시험"
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    needs: audit_0_to_5
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      QT_QPA_PLATFORM: xcb
      DEBIAN_FRONTEND: noninteractive
      GZ_SIM_RENDER_ENGINE: ogre2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Ubuntu 24.04 Gazebo Harmonic + ROS 2 Jazzy 설치"
        run: |
          set -euo pipefail
          for file in /etc/apt/sources.list.d/*; do
            if [ -f "$file" ] && grep -q 'packages.microsoft.com' "$file"; then
              sudo mv "$file" "$file.disabled"
            fi
          done
          timeout 240 sudo apt-get -o Acquire::Retries=2 update
          timeout 260 sudo apt-get install -y curl gnupg lsb-release software-properties-common \
            xvfb xauth libgl1-mesa-dri libegl1 libxkbcommon-x11-0
          sudo add-apt-repository -y universe
          sudo mkdir -p /usr/share/keyrings
          curl -fsSL --retry 3 --max-time 50 \
            https://packages.osrfoundation.org/gazebo.gpg |
            sudo tee /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg >/dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] https://packages.osrfoundation.org/gazebo/ubuntu-stable $(lsb_release -cs) main" |
            sudo tee /etc/apt/sources.list.d/gazebo-stable.list
          curl -fsSL --retry 3 --max-time 50 \
            https://raw.githubusercontent.com/ros/rosdistro/master/ros.key |
            sudo tee /usr/share/keyrings/ros-archive-keyring.gpg >/dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(lsb_release -cs) main" |
            sudo tee /etc/apt/sources.list.d/ros2.list
          timeout 280 sudo apt-get -o Acquire::Retries=2 update
          timeout 720 sudo apt-get -o Acquire::Retries=2 install -y \
            gz-harmonic ros-jazzy-ros-base ros-jazzy-ros-gz \
            ros-jazzy-gz-sim-vendor ros-jazzy-ros-gz-bridge \
            ros-jazzy-ros-gz-interfaces ros-jazzy-tf2-msgs \
            ros-jazzy-sensor-msgs ros-jazzy-std-msgs
      - name: "실제 Monaco 카메라·5등·3랩 감사 실행 — FAIL은 FAIL"
        run: |
          set -eo pipefail
          # ROS Jazzy setup.bash 내부에서는 미정의 환경 변수를 읽기 때문에
          # nounset(-u)를 해제한 뒤 환경을 불러오고 다시 엄격 셸 설정을 켠다.
          source /opt/ros/jazzy/setup.bash
          set -u
          # Jazzy ROS Gazebo vendor가 gz sim CLI 플러그인을 제공해야 한다.
          # 컨테이너의 기본 gz-tools만 있는 경우 실제 물리 시험을 시작하면 안 됨.
          echo "Gazebo command plugins:"; gz --commands
          gz sim --versions
          python3 scripts/stage5_prepare_monaco.py --ai AI-01
          python3 scripts/stage5_bridge.py
          export PYTHONUNBUFFERED=1
          export GZ_PARTITION="urrc_stage5_$(id -u)"
          xvfb-run -a -s '-screen 0 1600x1000x24' \
            python3 scripts/stage5_full_lap_audit.py \
              --minutes 180 --speed-limit 0.55
      - name: "완주 PASS 결과가 없으면 제출 실패"
        if: success()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("generated/stage5/monaco_real_three_lap_audit.json")
          data=json.loads(p.read_text())
          assert data["status"]=="PASS_REAL_MONACO_THREE_LAPS",data
          assert all(x["passed"] for x in data["checks"])
          print("PASS_REAL_MONACO_THREE_LAPS: 실제 3바퀴 체크포인트·무충돌·카메라 증거 확보")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monaco-actual-3lap-evidence-not-synthetic
          path: |
            generated/stage5/monaco_real_three_lap_audit.json
            generated/stage5/monaco_full_three_lap_console.log
            generated/stage5/AI-01/terrain_fidelity.json
            generated/stage5/AI-01/drive_status.json
            generated/stage5/AI-01/pose_status.json
            generated/stage5/AI-01/stage5_verdict.json
            generated/stage5/AI-01/lap_events.jsonl
            generated/stage5/AI-01/stall_reason.txt
            generated/stage5/AI-01/calibration.json
            generated/stage5/AI-01/rgb_camera.ppm
            generated/stage5/AI-01/rgb_camera_road_lost.ppm
            generated/stage5/AI-01/rgb_samples/*.ppm
            generated/stage5/AI-01/camera_light_gate.log
            generated/stage5/AI-01/rgb_controller.log
            generated/stage5/AI-01/race_supervisor.log
            generated/stage5/AI-01/calibration_gazebo.log
          if-no-files-found: warn
