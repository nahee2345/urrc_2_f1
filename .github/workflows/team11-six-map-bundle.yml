name: TEAM11 six-map embedded route validation

on:
  pull_request:
    paths:
      - 'src/team_11/**'
      - '.github/workflows/team11-six-map-bundle.yml'
  push:
    branches: [main, 'feature/team11-race-lidar-only-v1']
    paths:
      - 'src/team_11/**'
      - '.github/workflows/team11-six-map-bundle.yml'
  workflow_dispatch:

jobs:
  validate-map-routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate map selection and six three-lane routes
        run: |
          python3 -m unittest discover -s src/team_11/three_lane -p 'test_*.py' -v
          for track in monza spa monaco cota hungaroring baku; do
            python3 src/team_11/three_lane/map_library.py --track "$track" --output /tmp/team11_routes >/tmp/map_manifest.json
            test -f "/tmp/team11_routes/$track/lane_0.csv"
            test -f "/tmp/team11_routes/$track/lane_1.csv"
            test -f "/tmp/team11_routes/$track/lane_2.csv"
            echo "PASS $track"
          done
