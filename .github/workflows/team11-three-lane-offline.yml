name: TEAM11 three-lane offline
on:
  pull_request:
    paths:
      - 'src/team_11/**'
      - '.github/workflows/team11-three-lane-offline.yml'
  push:
    branches: ['team11-three-lane-practice']
    paths:
      - 'src/team_11/**'
      - '.github/workflows/team11-three-lane-offline.yml'
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python syntax
        run: python -m compileall -q src/team_11/three_lane
      - name: Run tests
        run: python -m unittest discover -v -s src/team_11/three_lane -p 'test_*.py'
      - name: Checkout exact practice map source
        uses: actions/checkout@v4
        with:
          repository: nahee2345/urrc_2
          path: urrc_source
      - name: Install road geometry validator
        run: python -m pip install shapely
      - name: Check 3 safe lanes on real Monza and Hungaroring
        run: python src/team_11/three_lane/validate_tracks.py --source urrc_source
      - name: Generate independent Monza world and routes
        run: python src/team_11/three_lane/run_demo.py monza --source urrc_source --prepare-only
      - name: Generate independent Hungaroring world and routes
        run: python src/team_11/three_lane/run_demo.py hungaroring --source urrc_source --prepare-only
      - name: Verify grid 01 camera start and zero synthetic blockers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for track in ('monza', 'hungaroring'):
              base=Path('urrc_source/generated/team11')/track
              data=json.loads((base/'team11_manifest.json').read_text())
              root=ET.parse(data['world_file']).getroot()
              world=root.find('world')
              models={m.get('name') for m in world.findall('model')}
              assert {'urrc_pace_grid_01','urrc_pace_grid_02','urrc_pace_grid_09'}<=models
              assert 'urrc_pace_grid_99' not in models
              assert data['grid_position']==1 and data['start_mode']=='camera'
              plugin=next(p for p in world.findall('plugin') if p.get('name')=='urrc::Team11ThreeLane')
              assert plugin.find('obstacle_name') is None
              print('PASS',track,'grid1 camera start, practice grids 2/9, no blocker')
          PY
