name: Stage 1 - vehicle SDF and physics tests
on:
  push:
    branches: [main]
    paths:
      - 'vehicle_generator/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - '.github/workflows/stage1-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Python structural validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q vehicle_generator scripts tests
      - run: python3 scripts/build_vehicle.py
      - run: python3 scripts/stage1_smoke.py --prepare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-static-sdf
          path: generated/

  gazebo:
    name: Gazebo Harmonic headless dynamics (isolated test world)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: static
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install Gazebo Harmonic
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg lsb-release
          sudo curl -fsSL https://packages.osrfoundation.org/gazebo.gpg -o /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] https://packages.osrfoundation.org/gazebo/ubuntu-stable $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/gazebo-stable.list
          sudo apt-get update
          sudo apt-get install -y gz-harmonic
      - name: Run isolated headless dynamics smoke
        run: python3 scripts/stage1_smoke.py --run --startup-seconds 8 --motion-seconds 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-gazebo-runtime-result
          path: generated/stage1_smoke_result.json
          if-no-files-found: warn
