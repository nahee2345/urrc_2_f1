name: "5단계 - Monaco AI-01 준비·센서·전륜 물리 시험"
on:
  push:
    branches: [main]
    paths:
      - 'stage5/**'
      - 'scripts/stage5_*.py'
      - 'tests/test_stage5_*.py'
      - '.github/workflows/stage5-monaco.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monaco_static:
    name: "Monaco 고저차·검정 AI-01·신호등·안전 단위 테스트"
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "0~5단계 전체 Python 회귀검사"
        run: python3 -m unittest discover -s tests -v
      - name: "Python 모듈 구문 검사"
        run: python3 -m compileall -q vehicle_generator stage3 stage4 stage5 scripts tests
      - name: "원본 GitHub 버전 고정 및 Monaco 생성"
        run: |
          python3 scripts/check_upstream.py
          python3 scripts/stage5_prepare_monaco.py --ai AI-01
          python3 scripts/stage5_bridge.py
          python3 scripts/stage5_run_monaco.py --ai AI-01 --dry-run
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path("generated/stage5/AI-01")
          f=json.loads((p/"terrain_fidelity.json").read_text())
          assert f["status"]=="PASS_MONACO_SOURCE_FIDELITY"
          assert f["elevation_reference_m"]>8
          assert f["mesh_z_range_m"]>6
          assert f["signal_lenses"]==5
          assert f["spectator_cameras"]==4
          b=(p/"bridge.yaml").read_text()
          assert b.count("direction: ROS_TO_GZ")==4
          assert "/model/urrc_ai_01/sensors/rgb" in b
          print("Monaco 공식 3D 지형·신호등·검정 AI-01·ROS2 브리지 계약 PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5-monaco-static-evidence
          path: |
            generated/stage5/AI-01/terrain_fidelity.json
            generated/stage5/AI-01/gates_summary.json
            generated/stage5/AI-01/bridge.yaml
          if-no-files-found: warn

  monaco_physics:
    name: "실제 Monaco 카메라·3D 지형 전륜구동 기초 검증"
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    needs: monaco_static
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Gazebo Harmonic 설치"
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          timeout 240 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=40 update
          timeout 240 sudo apt-get install -y curl gnupg lsb-release libegl1 libgl1-mesa-dri
          curl --fail --silent --show-error --max-time 45 --retry 2 \
            https://packages.osrfoundation.org/gazebo.gpg | sudo tee \
            /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg >/dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] https://packages.osrfoundation.org/gazebo/ubuntu-stable $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/gazebo-stable.list
          timeout 240 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=40 update
          timeout 420 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=40 install -y gz-harmonic
      - name: "Monaco 월드 생성 및 Gazebo SDF 유효성"
        run: |
          python3 scripts/stage5_prepare_monaco.py --ai AI-01
          export GZ_SIM_RESOURCE_PATH="$PWD/generated/stage5/resources/urrc_track_gazebo/models"
          export SDF_PATH="$PWD/generated/stage5/resources/urrc_track_gazebo/models"
          gz sdf -p generated/stage5/AI-01/monaco_experiment.sdf >/dev/null
      - name: "실제 Monaco 카메라 및 감독 포즈 송수신"
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 scripts/stage5_monaco_sensor_smoke.py \
            --ai AI-01 --startup-seconds 17 --capture-seconds 7
      - name: "실제 Monaco 전륜 모터 물리 이동 검증"
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 scripts/stage5_monaco_actuator_smoke.py \
            --startup-seconds 17 --motion-seconds 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5-monaco-actual-gazebo-results
          path: |
            generated/stage5/monaco_smoke_result.json
            generated/stage5/ai01_physics_result.json
          if-no-files-found: warn
