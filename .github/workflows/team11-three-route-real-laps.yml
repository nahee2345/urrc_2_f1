name: TEAM11 three physical one-lap trials
on:
  workflow_dispatch:
  push:
    branches: [team11-three-lane-practice]
    paths:
      - 'src/team_11/**'
      - '.github/workflows/team11-three-route-real-laps.yml'
jobs:
  independent-route-lap:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - uses: gazebo-tooling/setup-gazebo@v0.3.0
        with:
          required-gazebo-distributions: harmonic
      - run: sudo apt-get install -y cmake g++ libgz-sim8-dev cppzmq-dev libtinyxml2-dev
      - uses: actions/checkout@v4
        with:
          repository: nahee2345/urrc_2
          path: urrc_source
      - name: Real Monza full lap on lane ${{ matrix.lane }}, bypass disabled
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QPA_PLATFORM: offscreen
          EGL_PLATFORM: surfaceless
        run: |
          python3 src/team_11/three_lane/run_demo.py monza \
            --source "$PWD/urrc_source" --grid 1 \
            --lane ${{ matrix.lane }} --fixed-lane --start-mode immediate --server \
            >/tmp/route-runner.log 2>&1 &
          pid=$!
          log="$PWD/urrc_source/generated/team11/monza/team11_gazebo.log"
          found=0
          for i in $(seq 1 390); do
            if test -f "$log" && grep -Fq '[TEAM11 LAP] completed=1' "$log"; then
              found=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          kill -INT "$pid" 2>/dev/null || true
          wait "$pid" || true
          cat /tmp/route-runner.log
          if test -f "$log"; then tail -n 100 "$log"; fi
          test "$found" -eq 1 || { echo 'FAIL: one lap not completed'; exit 1; }
          grep -Fq '[TEAM11] IMMEDIATE start' "$log" || exit 1
          grep -Fq "lane=${{ matrix.lane }}" "$log" || exit 1
          echo 'PASS physical Gazebo lap for requested lane'
      - name: Upload independent lane run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team11-monza-lane-${{ matrix.lane }}-logs
          if-no-files-found: ignore
          path: |
            /tmp/route-runner.log
            urrc_source/generated/team11/monza/team11_gazebo.log
            urrc_source/generated/team11/monza/team11_manifest.json
