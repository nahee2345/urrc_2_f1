name: TEAM01 depth-lidar Monza real lap
on:
  push:
    branches: [main]
    paths:
      - 'src/team_01/**'
      - 'scripts/ci_team01_monza.sh'
      - '.github/workflows/team01-real-monza.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monza-lap:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout track submodule and vehicle code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure ROS 2 Jazzy apt sources
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Install Gazebo Harmonic and runtime dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ros-jazzy-ros-base ros-jazzy-ros-gz ros-jazzy-ros-gz-sim \
            ros-jazzy-rtabmap-ros ros-jazzy-tf2-ros \
            python3-colcon-common-extensions python3-numpy python3-opencv \
            libgl1-mesa-dri mesa-utils
      - name: Run real Gazebo sensor-driven Monza lap
        run: bash scripts/ci_team01_monza.sh
      - name: Publish diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team01-monza-${{ github.run_id }}
          path: ci_artifacts/
          if-no-files-found: warn
          retention-days: 14
