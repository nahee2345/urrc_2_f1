name: TEAM01 v10 real Monza lap
on:
  push:
    branches: [main]
    paths:
      - 'src/team_01/**'
      - 'scripts/ci_team01_monza.sh'
      - '.github/workflows/team01-real-monza.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monza-lap:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout full competition maps
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Install Jazzy and Gazebo Harmonic
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ros-jazzy-ros-base ros-jazzy-ros-gz ros-jazzy-ros-gz-sim \
            python3-colcon-common-extensions python3-numpy python3-opencv \
            libgl1-mesa-dri mesa-utils
      - name: Run REAL Gazebo Monza camera-lidar driving
        run: bash scripts/ci_team01_monza.sh
      - name: Upload actual simulation and odometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team01-monza-${{ github.run_id }}
          path: ci_artifacts/
          if-no-files-found: warn
          retention-days: 14
