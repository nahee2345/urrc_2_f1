name: Stage 2 - diverse Gazebo sensor kit
on:
  push:
    branches: [main]
    paths:
      - 'vehicle_generator/sensors.py'
      - 'vehicle_generator/model.py'
      - 'scripts/build_sensors.py'
      - 'scripts/stage2_sensor_smoke.py'
      - 'tests/test_stage2_sensors.py'
      - 'config/stage2_sensor_presets.json'
      - '.github/workflows/stage2-sensors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensor_static:
    name: Validate ten sensor-equipped physical vehicles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/build_sensors.py --ai all
      - run: python3 scripts/stage2_sensor_smoke.py --prepare --ai AI-05
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2-sensor-vehicle-models
          path: generated/stage2
          if-no-files-found: warn

  sensor_gazebo:
    name: Gazebo Harmonic actual RGB and 3D lidar messages
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    needs: sensor_static
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install Gazebo Harmonic and software OpenGL drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg lsb-release libegl1 libgl1-mesa-dri mesa-utils
          sudo curl -fsSL https://packages.osrfoundation.org/gazebo.gpg -o /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] https://packages.osrfoundation.org/gazebo/ubuntu-stable $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/gazebo-stable.list
          sudo apt-get update
          sudo apt-get install -y gz-harmonic
      - name: Verify SDF generated sensor models via Gazebo
        run: |
          python3 scripts/build_sensors.py
          for model in generated/stage2/AI-*/model.sdf; do
            gz sdf -p "$model" >/dev/null
          done
      - name: Actual headless RGB stereo depth and LiDAR payload tests
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          for ai in AI-03 AI-04 AI-05 AI-08 AI-10; do
            python3 scripts/stage2_sensor_smoke.py --run --ai "$ai" \
              --out "generated/stage2_${ai}_world.sdf" \
              --report "generated/stage2_${ai}_result.json" \
              --startup-seconds 15 --capture-seconds 9
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2-actual-sensor-validation
          path: generated/stage2_AI-*_result.json
          if-no-files-found: warn
