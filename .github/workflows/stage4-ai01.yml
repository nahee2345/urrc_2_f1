name: "4단계 - AI-01 검정 차량·RGB 자율주행 및 안전 제어 검증"
on:
  push:
    branches: [main]
    paths:
      - 'stage4/**'
      - 'vehicle_generator/model.py'
      - 'scripts/stage4_*.py'
      - 'tests/test_stage4_*.py'
      - '.github/workflows/stage4-ai01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage4_rules:
    name: "AI-01 도로 인식·조향·검정 차체·출발 안전 인터록 검사"
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "모든 단계 회귀 단위 테스트"
        run: python3 -m unittest discover -s tests -v
      - name: "Python 구문 검사"
        run: python3 -m compileall -q vehicle_generator stage3 stage4 scripts tests
      - name: "원본 git submodule 검증"
        run: python3 scripts/check_upstream.py
      - name: "AI-01 원본 몬자 3D 지형·검정 차량 생성 및 브리지 검사"
        run: |
          python3 scripts/stage3_prepare_monza.py --ai AI-01
          python3 scripts/stage4_bridge.py \
            --contacts generated/stage3/AI-01/contacts.json \
            --output generated/stage4/ai01_bridge.yaml
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          world=ET.parse("generated/stage3/AI-01/monza_experiment.sdf")
          body=world.find(".//model[@name='urrc_ai_01']/link[@name='base_link']/visual[@name='body_visual']")
          assert body is not None
          rgb=[float(x) for x in body.findtext('material/diffuse').split()[:3]]
          assert all(0<k<.05 for k in rgb),rgb
          bridge=Path("generated/stage4/ai01_bridge.yaml").read_text()
          assert bridge.count("direction: ROS_TO_GZ")==4
          assert "/model/urrc_ai_01/sensors/rgb" in bridge
          print("AI-01 검정 차체 및 물리 구동 ROS 토픽 계약 PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage4-ai01-config
          path: |
            generated/stage3/AI-01/terrain_fidelity.json
            generated/stage4/ai01_bridge.yaml
          if-no-files-found: warn

  stage4_monza:
    name: "실제 몬자 3D 노면 AI-01 전륜구동 물리 시험"
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    needs: stage4_rules
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Gazebo Harmonic 설치"
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          timeout 240 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=40 update
          timeout 240 sudo apt-get install -y curl gnupg lsb-release libegl1 libgl1-mesa-dri
          curl --fail --silent --show-error --max-time 45 --retry 2 \
            https://packages.osrfoundation.org/gazebo.gpg | sudo tee \
            /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg >/dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] https://packages.osrfoundation.org/gazebo/ubuntu-stable $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/gazebo-stable.list
          timeout 240 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=40 update
          timeout 420 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=40 install -y gz-harmonic
      - name: "공식 지형 기반 AI-01 차량 배치"
        run: |
          python3 scripts/stage3_prepare_monza.py --ai AI-01
          export GZ_SIM_RESOURCE_PATH="$PWD/generated/stage3/resources/urrc_track_gazebo/models"
          gz sdf -p generated/stage3/AI-01/monza_experiment.sdf >/dev/null
      - name: "Gazebo 실제 전륜구동 명령과 위치 변위 측정"
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QPA_PLATFORM: offscreen
        run: python3 scripts/stage4_monza_actuator_smoke.py --startup-seconds 19 --motion-seconds 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage4-ai01-physical-actuator-result
          path: generated/stage4/ai01_physics_result.json
          if-no-files-found: warn
