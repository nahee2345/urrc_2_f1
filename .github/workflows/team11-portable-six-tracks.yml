name: TEAM11 portable six-track map regression
on:
  push:
    branches: [main, feature/team11-map-replay-v1]
    paths:
      - 'src/team_11/**'
      - '.github/workflows/team11-portable-six-tracks.yml'
  pull_request:
    paths:
      - 'src/team_11/**'
      - '.github/workflows/team11-portable-six-tracks.yml'
  workflow_dispatch:
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python and validate map metadata
        run: |
          python -m compileall -q src/team_11/three_lane
          (cd src/team_11/three_lane && python -m unittest -v test_core test_track_catalog)
      - name: Verify exact official source-map revisions
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'src/team_11/three_lane')
          from track_catalog import TRACKS, validate_bundle
          for track in TRACKS:
              print(validate_bundle(track, source=Path('upstream/urrc_f1_ws')))
          PY
  prepare:
    needs: catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        track: [monza, spa, monaco, cota, hungaroring, baku]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build isolated TEAM11 world without Gazebo launch
        run: |
          python src/team_11/three_lane/run_demo.py ${{ matrix.track }} \
            --source upstream/urrc_f1_ws --prepare-only --grid 1 --start-mode camera
      - name: Validate generated model and map
        run: |
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          track='${{ matrix.track }}'
          p=Path('upstream/urrc_f1_ws/generated/team11') / track
          m=json.loads((p/'team11_manifest.json').read_text())
          assert m['track']==track
          assert len(m['routes'])==3
          assert all(Path(s).is_file() for s in m['routes'])
          world=ET.parse(m['world_file']).getroot().find('world')
          assert world is not None and world.get('name')==track
          assert len([q for q in world.findall('plugin') if q.get('name')=='urrc::Team11ThreeLane'])==1
          print('PASS: isolated world and three bundled routes for',track)
          PY
