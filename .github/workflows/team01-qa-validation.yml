name: TEAM01 independent QA - offline and real Gazebo
on:
  push:
    branches: [main]
    paths:
      - 'src/team_01/**'
      - 'scripts/ci_team01_monza.sh'
      - '.github/workflows/team01-qa-validation.yml'
      - 'scripts/qa_team01_*.py'
      - 'scripts/qa_team01_*.sh'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout track submodule and tested vehicle code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure ROS 2 Jazzy apt sources
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Install Gazebo, ROS, RTAB-Map and QA dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ros-jazzy-ros-base ros-jazzy-ros-gz ros-jazzy-ros-gz-sim \
            ros-jazzy-rtabmap-ros ros-jazzy-tf2-ros \
            python3-colcon-common-extensions python3-numpy python3-opencv \
            ros-jazzy-rosbag2 ros-jazzy-rosbag2-storage-default-plugins \
            libgl1-mesa-dri mesa-utils
      - name: Validate independent QA code syntax
        run: |
          bash -n scripts/qa_team01_gazebo.sh
          python3 -m py_compile scripts/qa_team01_metrics.py scripts/qa_team01_report.py scripts/qa_team01_source_limits.py scripts/qa_team01_permission.py src/team_01/team01_race/team01_race/qa_lap_frame.py src/team_01/team01_race/scripts/verify_monza_lap.py
          PYTHONPATH=src/team_01/team01_race python3 scripts/qa_team01_frame_test.py
      - name: Enforce 400-line maximum in source and model configuration
        id: size_gate
        continue-on-error: true
        shell: bash
        run: python3 scripts/qa_team01_source_limits.py --limit 400 --report ci_artifacts/source_line_limits.json
      - name: Offline unit and static regression tests (independent verdict)
        id: offline
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ci_artifacts
          set +e
          bash src/team_01/team01_race/scripts/run_offline_tests.sh >ci_artifacts/offline_qa.log 2>&1
          result=$?
          set -e
          cat ci_artifacts/offline_qa.log
          echo "offline_exit=$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Real Gazebo Monza run regardless of offline test result
        id: gazebo
        shell: bash
        env:
          TEAM01_QA_GAZEBO_ONLY: "1"
        run: bash scripts/qa_team01_gazebo.sh
      - name: Summarize QA evidence
        if: always()
        shell: bash
        run: |
          mkdir -p ci_artifacts
          {
            echo "# TEAM01 independent QA"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Source <=400 lines: ${{ steps.size_gate.outcome }}"
            echo "- Offline tests: ${{ steps.offline.outcome }}"
            echo "- Real Gazebo run: ${{ steps.gazebo.outcome }}"
            echo "- RTAB-Map package installed; runtime SLAM/loop-closure must be proven by controller and TF logs."
            echo "- A 1-lap run does NOT certify a 2nd-lap 10m/s target, overtaking or merge."
            echo ""
            echo "Artifacts: offline_qa.log, controller.log, gazebo.log, lap.json, verifier.log, and signal/sensor logs when created."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f ci_artifacts/qa_run_report.md ]]; then
            cat ci_artifacts/qa_run_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f ci_artifacts/controller.log ]]; then
            grep -Ei '(rtabmap|icp_odometry|slam|map_ready|loop.closure|tf.*error|no.verified|road=False)' ci_artifacts/controller.log | tail -n 180 > ci_artifacts/slam_diagnostics.txt || true
          fi
      - name: Upload all QA logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team01-independent-qa-${{ github.run_id }}
          path: ci_artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Save per-run textual QA result to GitHub (not rosbag binaries)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reports/team01/runs
          DEST="reports/team01/runs/${{ github.run_id }}-${{ github.sha }}.md"
          if [[ -f ci_artifacts/qa_run_report.md ]]; then
            cp ci_artifacts/qa_run_report.md "$DEST"
          else
            printf '# TEAM01 run %s\n\nReal Gazebo QA did not produce route metrics. See Actions logs.\n' '${{ github.run_id }}' > "$DEST"
          fi
          {
            echo ""
            echo "## Workflow verdict"
            echo "- Source <=400 lines: ${{ steps.size_gate.outcome }}"
            echo "- Offline regression: ${{ steps.offline.outcome }}"
            echo "- Real Gazebo: ${{ steps.gazebo.outcome }}"
            echo "- Code SHA: ${{ github.sha }}"
            echo "- Raw rosbag and logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Raw artifacts are stored by GitHub Actions, not committed to the Git tree."
          } >> "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "docs(qa): save drive verification summary for run ${{ github.run_id }}" || exit 0
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            git push origin HEAD:main && exit 0
            sleep 2
          done
          echo "QA textual report push failed; Actions artifact remains available" >&2
          exit 1
      - name: Final combined QA verdict
        if: always()
        shell: bash
        run: |
          echo "source_size=${{ steps.size_gate.outcome }}, offline=${{ steps.offline.outcome }}, gazebo=${{ steps.gazebo.outcome }}"
          [[ "${{ steps.size_gate.outcome }}" == "success" && "${{ steps.offline.outcome }}" == "success" && "${{ steps.gazebo.outcome }}" == "success" ]]
