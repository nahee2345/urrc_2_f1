team_01_camera_perception:
  ros__parameters:
    camera:
      process_fps: 20.0
      debug_fps: 5.0
      opencv_threads: 2
    vision:
      horizon: 5.0
      spacing: 0.10
      bev_near: 0.50
      bev_half_width: 3.0
      bev_resolution: 0.025
      road_roi_top: 0.42
      traffic_roi_bottom: 0.35
      road_hsv_low: [0, 0, 20]
      road_hsv_high: [179, 140, 175]
      white_hsv_low: [0, 0, 110]
      white_hsv_high: [179, 100, 255]
      red1_low: [0, 110, 100]
      red1_high: [12, 255, 255]
      red2_low: [168, 110, 100]
      red2_high: [179, 255, 255]
      yellow_low: [18, 100, 140]
      yellow_high: [38, 255, 255]
      green_low: [40, 140, 150]
      green_high: [95, 255, 255]
      light_min_area: 4.0
      light_max_area: 1500.0
      light_min_value: 150
      light_off_max_value: 130
      light_confirm_frames: 3
      light_row_tolerance: 0.6
      light_size_ratio_max: 2.0
      required_red_lights: 5
      min_boundary_samples: 8
      min_track_width: 0.55
      max_track_width: 4.0
      width_history_sec: 2.0
      boundary_fit_order: 2
      wall_support_dilate_px: 15
      boundary_near_fit_span: 0.8
      wall_min_vertical_ratio: 0.85
      wall_min_height_px: 6

team_01_lidar_obstacle:
  ros__parameters:
    obstacle:
      detection_distance_m: 5.0
      min_vehicle_width_m: 0.12
      max_vehicle_width_m: 0.80
      min_vehicle_depth_m: 0.10
      max_vehicle_depth_m: 1.20
      confirm_frames: 3
      release_frames: 3
      match_distance_m: 0.8
      track_timeout_sec: 0.3
    perception:
      min_valid_scan_beams: 20
      cluster_gap_m: 0.14
    lidar_obstacle_filter:
      use_camera_wall_filter: true
      wall_reject_margin_m: 0.06
      min_obstacle_wall_separation_m: 0.08
      path_obstacle_half_width_m: 0.0  # Auto: SDF envelope width/2 + 0.15 m
      max_camera_lidar_age_diff_sec: 0.15
      camera_timeout_sec: 0.25
      min_boundary_confidence: 0.40
      high_boundary_confidence: 0.75
      wall_alignment_cosine: 0.94
      wall_aspect_ratio: 5.0
      wall_shape_region_m: 0.12

team_01_decision:
  ros__parameters:
    imu_topic: /team_01/imu
    imu:
      pitch_alpha: 0.30
    ramp:
      enter_deg: 5.0
      exit_deg: 3.0
      confirm_frames: 3
      exit_confirm_frames: 3
      max_speed_mps: 5.0
    require_official_start: true
    race_start_topic: /race/start/team_01
    planner:
      planning_horizon_m: 5.0
      trajectory_spacing_m: 0.10
      temporal_history_sec: 0.5
      trajectory_temporal_alpha: 0.30
      cruise_speed_mps: 10.0
      min_path_confidence: 0.40
      max_lateral_accel_mps2: 3.0
    obstacle:
      vehicle_lateral_margin_m: 0.15
      vehicle_longitudinal_margin_m: 0.30
    traffic:
      start_mode: red_lights_out
      yellow_behavior: stop
    safety:
      imu_timeout_sec: 0.25
      imu_stale_speed_mps: 5.0
      path_ready_confirm_frames: 3
      camera_timeout_sec: 0.25
      sensor_timeout_sec: 0.25
      max_sensor_skew_sec: 0.15
      emergency_ttc_sec: 0.6
      front_obstacle_stop_distance_m: 0.5
      caution_ttc_sec: 1.5
      assumed_max_decel_mps2: 2.5

team_01_control_adapter:
  ros__parameters:
    control:
      command_rate_hz: 50.0
      max_speed_mps: 10.0
      max_steering_angle_rad: 0.523599
      max_accel_mps2: 1.0
      max_decel_mps2: 2.5
      max_steering_rate_radps: 1.5
      min_lookahead_m: 1.0
      max_lookahead_m: 3.0
      lookahead_alpha: 0.25
      lookahead_speed_reference_mps: 10.0
      max_lateral_accel_mps2: 3.0
    safety:
      command_timeout_sec: 0.25
      path_timeout_sec: 0.5
